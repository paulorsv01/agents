# Preferências portáveis do Codex. O install.sh copia para ~/.codex/config.toml só as chaves
# que ainda não existem lá; o que o Codex grava sozinho (projects, plugins, hooks.state) fica fora.

model = "gpt-6-astra"
model_reasoning_effort = "medium"
model_reasoning_summary = "concise"
model_verbosity = "medium"
personality = "pragmatic"
web_search = "indexed"

[features]
js_repl = false
memories = false
chronicle = false
prevent_idle_sleep = true

[memories]
generate_memories = false
use_memories = false
disable_on_external_context = true

[shell_environment_policy]
inherit = "core"

[tui]
fullscreen_transcript = true
theme = "ansi"
status_line = ["model-with-reasoning", "current-dir", "thread-name", "git-branch", "pull-request-number", "permissions", "weekly-limit"]
status_line_use_colors = true

[mcp_servers.figma]
enabled = true
url = "http://127.0.0.1:3845/mcp"
